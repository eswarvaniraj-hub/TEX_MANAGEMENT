services:
  - type: web
    name: tex-arun-app
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: OWNER_USERNAME
        value: owner
      - key: OWNER_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tex-arun-db
          property: connectionString

databases:
  - name: tex-arun-db
    plan: free
    region: singapore
    databaseName: textile_accounts
    user: postgres
