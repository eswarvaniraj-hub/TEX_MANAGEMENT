server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

spring:
  datasource:
    url: "${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:textile_accounts}}}"
    username: "${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}"
    password: "${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}"
    driver-class-name: org.postgresql.Driver
